<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap-5.3.3-dist/css/bootstrap.min.css' %}" defer>
    <link rel="stylesheet" href="{% static 'storage/stylesheets/styles.css' %}" defer>
    <link rel="stylesheet" href="{% static 'storage/stylesheets/index.css' %}" defer>
    <script src="{% static 'bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js' %}" async></script>
  <title>Login</title>
</head>
<body>
  <div class="container-fluid px-5">
    <nav class="navbar navbar-expand-md navbar-light navbar-transparent d-flex justify-content-center" style="border-bottom: 1px solid black;">
        <div class="container-fluid">
            <a class="navbar-brand ms-5 ps-5" href="{% url 'storage:index'%}">
                <img src="{% static 'storage/images/logo.png' %}" alt="Logo" height="60" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-3 mb-lg-0 ps-5">
                    <li class="nav-item">
                        <a class="nav-link active px-5 navbar-link" aria-current="page" href="{% url 'storage:storage' %}" style="font-size: 18px; border-right: solid black 1px;"  onmouseover="this.style.color='#787575'" onmouseout="this.style.color='#000'">STORAGE</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active px-5 navbar-link" href="{% url 'storage:stats'%}" style="font-size: 18px;" onmouseover="this.style.color='#787575'" onmouseout="this.style.color='#000'">STATS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active px-5 navbar-link" href="{% url 'storage:config'%}" style="font-size: 18px;  border-left: solid black 1px;" onmouseover="this.style.color='#787575'" onmouseout="this.style.color='#000'">CONFIG</a>
                    </li>
                </ul>

                <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
                    <ul class="navbar-nav ms-auto me-5">
                      <li class="nav-item dropdown">
                        <button class="btn dropdown-toggle d-flex align-items-center" data-bs-toggle="dropdown" aria-expanded="false">
                          <img src="{% static 'storage/images/icons/person-circle.svg'%}">
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark">
                          <li><button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#modal-login">Login</button></li>
                          <li><button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#modal-register">Register</button></li>
                          <li><button class="dropdown-item">Logout</button></li>
                        </ul>
                      </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
  </div>

 
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 text-center d-flex justify-content-center">

        <div class="card" style="width: 25rem; border-radius: 1rem;">
          <div class="card-body">
            <div class="container py-5 h-100">
              <div class="row d-flex justify-content-center align-items-center h-100">
                  <div class="col-12 text-center">
                      <div class="mb-md-5 mt-md-4 pb-5">
                          <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
                          <p class="text-white-50 mb-5">Please enter your login and password!</p>
                          <form id="login-form" method="post">
                              {% csrf_token %}
                              <div class="form-outline form-white mb-4">
                                  {{ form.username }}
                                  {% if form.errors %}
                                      <div class="invalid-feedback">
                                      {% for error in errors %}
                                          {{ error }}
                                      {% endfor %}
                                      </div>
                                  {% endif %}
                              </div>
                  
                              <div class="form-outline form-white mb-4">
                                  {{ form.password }}   
                              </div>
                  
                              <p class="small mb-5 pb-lg-2"><a class="text-white-50" href="#!">Forgot password?</a></p>
                  
                              <button class="btn btn-outline-light btn-lg px-5" type="submit">Login</button>
                          </form>
              
                          <div class="d-flex justify-content-center text-center mt-4 pt-1">
                              <a href="#!" class="text-white"><i class="fab fa-facebook-f fa-lg"></i></a>
                              <a href="#!" class="text-white"><i class="fab fa-twitter fa-lg mx-4 px-2"></i></a>
                              <a href="#!" class="text-white"><i class="fab fa-google fa-lg"></i></a>
                          </div>
                      </div>
                      <div>
                      <p class="mb-0">Don't have an account?<button class="btn text-white-50 fw-bold" data-bs-toggle="modal" data- data-bs-target="#modal-register">Sign Up</button>
                      </p>
                      </div>
                  </div>
              </div>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
              

</body>
</html>
